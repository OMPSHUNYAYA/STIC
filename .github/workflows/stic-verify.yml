name: stic-verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify required repository files exist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          required_paths = [
              "README.md",
              "LICENSE",
              "demo/stic_integrated_demo_v3_2.py",
              "demo/STIC_HTML_v3_2.html",
              "docs/Quickstart.md",
              "docs/FAQ.md",
              "docs/Proof-Sketch.md",
              "docs/STIC-Architecture-Notes.md",
              "docs/STIC-Challenge.md",
              "docs/STIC_v1.3.pdf",
              "docs/STIC-Diagram.png",
              "docs/Dependency-Elimination-Framework.png",
              "docs/Shunyaya-Structural-Stack.png",
              "VERIFY/VERIFY.txt",
              "VERIFY/FREEZE_DEMO_SHA256.txt",
          ]

          missing = [p for p in required_paths if not Path(p).exists()]
          if missing:
              print("ERROR: Missing required repository files:")
              for p in missing:
                  print(" -", p)
              sys.exit(1)

          print("Required repository files verified.")
          PY

      - name: Verify frozen SHA256 hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import re
          import sys
          from pathlib import Path

          freeze_path = Path("VERIFY/FREEZE_DEMO_SHA256.txt")

          targets = {
              "demo/stic_integrated_demo_v3_2.py": Path("demo/stic_integrated_demo_v3_2.py"),
              "demo/STIC_HTML_v3_2.html": Path("demo/STIC_HTML_v3_2.html"),
          }

          freeze_text = freeze_path.read_text(encoding="utf-8", errors="replace")

          def sha256_file(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for label, path in targets.items():
              label_variants = [
                  re.escape(label),
                  re.escape(label.replace("/", "\\")),
              ]

              pattern = rf"({'|'.join(label_variants)})\s*SHA256:\s*([0-9a-f]{{64}})"
              match = re.search(pattern, freeze_text, re.IGNORECASE)

              if not match:
                  print(f"ERROR: No frozen SHA256 entry found for {label}")
                  sys.exit(1)

              expected = match.group(2).lower()
              actual = sha256_file(path).lower()

              if actual != expected:
                  print(f"ERROR: Hash mismatch for {label}")
                  print("Expected:", expected)
                  print("Actual:  ", actual)
                  sys.exit(1)

              print(f"Hash verified for {label}: {actual}")

          print("Frozen SHA256 verification completed.")
          PY

      - name: Run STIC Python demo
        shell: bash
        run: |
          python demo/stic_integrated_demo_v3_2.py

      - name: Verify STIC output markers
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys

          cmd = [sys.executable, "demo/stic_integrated_demo_v3_2.py"]
          result = subprocess.run(cmd, capture_output=True, text=True, check=True)
          out = result.stdout

          required_markers = [
              "STIC v3.2",
              "Structural Integrity without Cloud",
              "correctness = resolve(structure)",
              "CASE 1",
              "CASE 2",
              "CASE 3",
              "System correctness: CORRECT",
              "System correctness: ABSTAIN",
              "System correctness: BLOCKED",
              "Replay match: True",
              "Same correctness: True",
              "Same certificate: True",
              "Same structure -> same correctness -> same certificate",
              "Structure alone determines correctness",
          ]

          missing = [marker for marker in required_markers if marker not in out]
          if missing:
              print("ERROR: STIC output missing expected markers:")
              for marker in missing:
                  print(" -", marker)
              print("\nFull output:\n")
              print(out)
              sys.exit(1)

          print("STIC output markers verified.")
          PY

      - name: Verify deterministic demo output
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys

          cmd = [sys.executable, "demo/stic_integrated_demo_v3_2.py"]

          result1 = subprocess.run(cmd, capture_output=True, text=True, check=True)
          result2 = subprocess.run(cmd, capture_output=True, text=True, check=True)

          if result1.stdout != result2.stdout:
              print("ERROR: Non-deterministic STIC output for identical run")
              sys.exit(1)

          print("Deterministic STIC output verified.")
          PY

      - name: Verify HTML demo contains expected STIC hooks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          text = Path("demo/STIC_HTML_v3_2.html").read_text(encoding="utf-8", errors="replace")

          required_snippets = [
              "STIC",
              "Structural Integrity",
              "correctness",
              "structure",
              "CORRECT",
              "ABSTAIN",
              "BLOCKED",
              "cloud",
              "network",
              "execution",
          ]

          missing = [snippet for snippet in required_snippets if snippet not in text]
          if missing:
              print("ERROR: HTML demo is missing expected STIC hooks:")
              for snippet in missing:
                  print(" -", snippet)
              sys.exit(1)

          print("HTML demo structural hooks verified.")
          PY

      - name: Verify README contains core STIC claims
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          text = Path("README.md").read_text(encoding="utf-8", errors="replace")

          required_snippets = [
              "Structural Integrity without Cloud",
              "Correctness Without Cloud Dependency",
              "system_correctness = resolve(structure)",
              "correctness_visible iff structure_complete AND structure_consistent",
              "same structure -> same correctness -> same certificate",
              "correctness != infrastructure",
              "correctness = resolve(structure)",
              "STIC Challenge",
              "demo/stic_integrated_demo_v3_2.py",
              "VERIFY/FREEZE_DEMO_SHA256.txt",
          ]

          missing = [snippet for snippet in required_snippets if snippet not in text]
          if missing:
              print("ERROR: README.md is missing expected STIC claims:")
              for snippet in missing:
                  print(" -", snippet)
              sys.exit(1)

          print("README core claims verified.")
          PY
